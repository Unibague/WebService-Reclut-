services:
  webservice-reclut:
    build: .
    container_name: webservice-reclut
    restart: unless-stopped
    env_file:
      - .env   # ver .env.example — no se sube al repositorio
    ports:
      - "8080:80"
    volumes:
      - ./cache:/var/www/html/cache   # caché persiste fuera del contenedor
